when:
  - event: push
    branch: ci-testing

steps:
  - name: build
    image: xmlcalabash-build
    environment:
      LIBRARY_PASSPHRASE:
        from_secret: LIBRARY_PASSPHRASE
    commands:
      - git submodule init
      - git submodule update
      - cat /private/xmlcalabash-libs.enc | openssl enc -aes-256-cbc -salt -pbkdf2 -d -k $${LIBRARY_PASSPHRASE}} | tar zxf -
      - ./gradlew --console=plain test
  - name: test-report
    image: xmlcalabash-build
    commands:
      - echo ./gradlew --console=plain test-driver:test-report
      - pwd

services:
  - name: apache2
    image: apache2

  - name: sendria
    image: sendria
    environment:
      MAIL_DRIVER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_USERNAME: username
      MAIL_PASSWORD: password
      MAIL_ENCRYPTION: tcp
      MAIL_FROM_ADDRESS: nobody@example.com
