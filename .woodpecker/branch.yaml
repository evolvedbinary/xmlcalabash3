when:
  - event: push
    branch: ci-testing

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  - name: build
    image: xmlcalabash-build
    environment:
      LIBRARY_PASSPHRASE:
        from_secret: LIBRARY_PASSPHRASE
      SMTPSERVER: sendria
    commands:
      - cat /private/xmlcalabash-libs.enc | openssl enc -aes-256-cbc -salt -pbkdf2 -d -k $${LIBRARY_PASSPHRASE} | tar zxf -
      - ls -l /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/htdocs
      - echo ./gradlew --console=plain   test 
  - name: test-report
    image: xmlcalabash-build
    commands:
      - echo ./gradlew --console=plain -PWHOST=http://apache2 -PSHOST=sendria test-driver:test-report
      - echo "Hello"
      - pwd

services:
  - name: apache2
    image: apache2
    volumes:
      - /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/htdocs:/usr/local/apache2/htdocs
      - /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/cache:/usr/local/apache2/cache
      - /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/cgi-bin:/usr/local/apache2/cgi-bin
      - /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/service:/usr/local/apache2/service
      - /woodpecker/src/codeberg.org/xmlcalabash/xmlcalabash3/tests/3.0-test-suite/docker/apache2/conf:/usr/local/apache2/conf

  - name: sendria
    image: sendria
    environment:
      MAIL_DRIVER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_USERNAME: username
      MAIL_PASSWORD: password
      MAIL_ENCRYPTION: tcp
      MAIL_FROM_ADDRESS: nobody@example.com
